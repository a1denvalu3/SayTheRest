[package]
name = "say-the-rest-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
clipboard-rs = { version = "0.3.5", default-features = false, features = ["wayland"] }
enigo = "0.6"
hound.workspace = true
reqwest.workspace = true
rminiaudio.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-single-instance = "2.4.3"
tokio.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
uiautomation = { version = "0.25", default-features = false, features = ["pattern", "input"] }

[target.'cfg(target_os = "linux")'.dependencies]
atspi = "0.30"
arboard = { version = "3.6.1", default-features = false }
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "clipboard", "remote_desktop", "screencast"] }
wl-clipboard-rs = "0.9.3"
