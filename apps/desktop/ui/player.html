<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>sayIt player</title><script src="theme.js"></script><link rel="stylesheet" href="player.css"><link rel="stylesheet" href="compact.css"></head>
<body class="compact-player"><header class="compact-heading"><h1>sayIt</h1><button id="close-player" aria-label="Close player" title="Close">×</button></header>
<main>      <article class="playback-panel player-card">
        <p id="playback-status" class="playback-status" role="status">Ready to read</p>
        <h2 id="now-title" class="now-title" hidden></h2>
        <div id="generation-indicator" class="generation-indicator" role="status" hidden><i class="preparing-dot" aria-hidden="true"></i><span id="generation-detail">Generating speech locally</span></div>
        <div class="waveform-track"><canvas id="waveform" aria-hidden="true"></canvas><input id="timeline" type="range" min="0" max="0" value="0" step="0.1" aria-label="Playback position" disabled></div>
        <div class="time-row"><span id="position">0:00</span><span id="duration">0:00</span></div>
        <div class="transport" aria-label="Playback controls">
          <button id="volume-toggle" aria-label="Playback volume" aria-expanded="false" title="Volume"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/><path d="M16 8c3 2 3 6 0 8m3-11c5 4 5 10 0 14" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
          <button id="rate-toggle" aria-label="Playback speed" aria-expanded="false" title="Speed">1×</button>
          <button data-control="seek-back" aria-label="Back 15 seconds" title="Back 15 seconds"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7a8 8 0 1 1-1 9M5 2v6H0" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="12" y="16" text-anchor="middle" font-size="9" fill="currentColor">15</text></svg></button>
          <button class="primary-control" id="play-toggle" aria-label="Play" data-playing="false" disabled><svg class="play-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 4 13 8-13 8z" fill="currentColor"/></svg><svg class="pause-glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/></svg></button>
          <button data-control="seek-forward" aria-label="Forward 30 seconds" title="Forward 30 seconds"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 7a8 8 0 1 0 1 9M19 2v6h5" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="12" y="16" text-anchor="middle" font-size="9" fill="currentColor">30</text></svg></button>
          <button data-control="stop" aria-label="Stop speech" title="Clear recording"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
        </div>
        <div class="adjustment-pane" id="rate-pane" hidden><label for="rate">Playback speed</label><input id="rate" type="range" min="0.5" max="3" step="0.05" value="1"><output id="rate-value" for="rate">1×</output></div>
        <div class="adjustment-pane" id="volume-pane" hidden><label for="volume">Volume</label><input id="volume" type="range" min="0" max="1" step="0.05" value="1"><output id="volume-value" for="volume">100%</output></div>
        <div class="reader-section" id="reader-section" hidden><div id="reader-viewport" class="reader-viewport" tabindex="0" role="region" aria-label="Spoken text. Choose a word to seek."><p id="spoken-text" class="spoken-text"></p></div><button id="follow-reader" class="follow-reader" hidden>Follow spoken text</button></div>
      </article>
<section id="idle-actions" class="idle-actions"><button id="read-clipboard">Read clipboard <span aria-hidden="true">↗</span></button><div class="recent-heading"><h2>Recent history</h2><button id="all-history">View all</button></div><div id="recent-history"></div></section></main>
<footer class="player-footer"><label class="model-choice"><span class="visually-hidden">Speech model</span><select id="player-model" title="Choose the model for new speech"><option value="">Choose a model</option></select></label><label class="voice-choice"><span class="visually-hidden">Speech voice</span><select id="player-voice" title="Choose the voice for new speech"><option value="">Choose a voice</option></select></label><button id="open-settings">Settings…</button><button id="quit-player">Quit</button></footer><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="reader-timing.js"></script><script src="playback-ui.js"></script><script src="compact.js"></script></body></html>
