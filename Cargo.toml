[workspace]
members = ["crates/core", "crates/protocol", "crates/service", "apps/cli", "apps/service", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/a1denvalu3/say-the-rest"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rminiaudio = "0.1"
hound = "3.5"
libloading = "0.8"
html-escape = "0.2"
regex = "1.11"
unicode-normalization = "0.1"
bzip2 = "0.6"
flate2 = "1.1"
zip = { version = "4.6", default-features = false, features = ["deflate"] }
sha2 = "0.10"
tar = "0.4"
url = "2.5"
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-build = "2.5"
