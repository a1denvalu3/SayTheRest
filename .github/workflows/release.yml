name: Release packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            runtime: sherpa-onnx-v1.13.4-linux-x64-shared.tar.bz2
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            runtime: sherpa-onnx-v1.13.4-win-x64-shared-MT-Release.tar.bz2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libclang-dev libdbus-1-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev dpkg-dev desktop-file-utils patchelf xvfb
      - name: Test workspace
        run: cargo test --workspace --locked --target '${{ matrix.target }}'
      - name: Test reader timing and Unicode word seeking
        run: node --test apps/desktop/tests/reader-timing.test.cjs
      - name: Test rich clipboard preservation on Linux display
        if: runner.os == 'Linux'
        shell: bash
        run: env -u WAYLAND_DISPLAY xvfb-run -a cargo test -p sayit-desktop --locked --target '${{ matrix.target }}' selection::tests::rich_clipboard_snapshot_restores_multiple_formats -- --ignored --exact
      - name: Test rich clipboard preservation on Windows desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo test -p sayit-desktop --locked --target '${{ matrix.target }}' selection::tests::rich_clipboard_snapshot_restores_multiple_formats -- --ignored --exact
      - name: Package
        shell: bash
        run: ./scripts/package-release.sh '${{ matrix.target }}' '${{ matrix.runtime }}'
      - name: Test Kitten models through packaged resident runtime
        shell: bash
        run: ./scripts/test-kitten-models.sh '${{ matrix.target }}'
      - name: Test Phonon install, voices, streaming, and recovery
        shell: bash
        run: ./scripts/test-phonon.sh '${{ matrix.target }}'
      - name: Test Pocket presets, cloning, cancellation, and installation
        shell: bash
        run: ./scripts/test-pocket-model.sh '${{ matrix.target }}'
      - name: Test native Qwen discovery, cloning, languages, and recovery
        shell: bash
        run: ./scripts/test-qwen-native.sh '${{ matrix.target }}'
      - name: Audit Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test -x "dist/sayIt-${VERSION}-x86_64.AppImage"
          test -f "dist/sayit_${VERSION}_amd64.deb"
          test -f dist/sayit-x86_64-unknown-linux-gnu.tar.gz
          tar -tzf dist/sayit-x86_64-unknown-linux-gnu.tar.gz > "$RUNNER_TEMP/portable-files.txt"
          grep -q '/sayit-desktop$' "$RUNNER_TEMP/portable-files.txt"
          grep -q '/runtime/bin/sherpa-onnx-offline-tts$' "$RUNNER_TEMP/portable-files.txt"
          grep -q '/runtime/generative/qwen_worker.py$' "$RUNNER_TEMP/portable-files.txt"
          dpkg-deb --contents "dist/sayit_${VERSION}_amd64.deb" > "$RUNNER_TEMP/deb-files.txt"
          grep -q '/opt/sayit/sayit-service$' "$RUNNER_TEMP/deb-files.txt"
          grep -q '/usr/lib/systemd/user/sayit-desktop.service$' "$RUNNER_TEMP/deb-files.txt"
      - name: Audit Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = 'dist/sayit-x86_64-pc-windows-msvc.zip'
          $installer = 'dist/sayIt-Setup-x64.exe'
          if (!(Test-Path $zip -PathType Leaf)) { throw "Missing portable ZIP: $zip" }
          if (!(Test-Path $installer -PathType Leaf)) { throw "Missing installer: $installer" }
          $audit = Join-Path $env:RUNNER_TEMP 'sayit-package-audit'
          Expand-Archive -LiteralPath $zip -DestinationPath $audit
          $root = Join-Path $audit 'sayit-x86_64-pc-windows-msvc'
          @(
            'sayit.exe',
            'sayit-service.exe',
            'sayit-desktop.exe',
            'setup.ps1',
            'runtime/bin/sherpa-onnx-offline-tts.exe',
            'runtime/generative/qwen_worker.py'
          ) | ForEach-Object {
            $path = Join-Path $root $_
            if (!(Test-Path $path -PathType Leaf)) { throw "Missing packaged file: $path" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: sayit-${{ matrix.target }}
          path: |
            dist/sayit-${{ matrix.target }}.*
            dist/sayIt-Setup-x64.exe
            dist/sayit_*_amd64.deb
            dist/sayIt-*-x86_64.AppImage

  publish:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
